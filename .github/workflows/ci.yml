name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================
  # Build Job
  # ============================================
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Generate version
        id: version
        run: |
          # Generate version based on date and short SHA
          VERSION="1.0.$(date +%Y%m%d)-${GITHUB_SHA::7}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Build with Maven
        run: ./mvnw package -DskipTests -B

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

  # ============================================
  # Unit Test Job
  # ============================================
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      checks: write  # Required for test reporter

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests with coverage
        run: ./mvnw test jacoco:report -B

      - name: Publish Test Report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: JUnit Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Generate test summary
        if: always()
        run: |
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Parse JUnit XML for summary
          if [ -d target/surefire-reports ]; then
            TESTS=$(grep -h 'testsuite' target/surefire-reports/*.xml 2>/dev/null | head -1 | sed -n 's/.*tests="\([^"]*\)".*/\1/p' || echo "0")
            FAILURES=$(grep -h 'testsuite' target/surefire-reports/*.xml 2>/dev/null | head -1 | sed -n 's/.*failures="\([^"]*\)".*/\1/p' || echo "0")
            ERRORS=$(grep -h 'testsuite' target/surefire-reports/*.xml 2>/dev/null | head -1 | sed -n 's/.*errors="\([^"]*\)".*/\1/p' || echo "0")
            SKIPPED=$(grep -h 'testsuite' target/surefire-reports/*.xml 2>/dev/null | head -1 | sed -n 's/.*skipped="\([^"]*\)".*/\1/p' || echo "0")
            
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | $((TESTS - FAILURES - ERRORS - SKIPPED)) |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | $FAILURES |" >> $GITHUB_STEP_SUMMARY
            echo "| ⚠️ Errors | $ERRORS |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏭️ Skipped | $SKIPPED |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Extract coverage from JaCoCo
          if [ -f target/site/jacoco/jacoco.csv ]; then
            echo "## 📊 Code Coverage" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Calculate coverage percentage
            MISSED=$(awk -F',' 'NR>1 {sum+=$4} END {print sum}' target/site/jacoco/jacoco.csv)
            COVERED=$(awk -F',' 'NR>1 {sum+=$5} END {print sum}' target/site/jacoco/jacoco.csv)
            TOTAL=$((MISSED + COVERED))
            if [ $TOTAL -gt 0 ]; then
              COVERAGE=$((COVERED * 100 / TOTAL))
              echo "**Line Coverage: ${COVERAGE}%**" >> $GITHUB_STEP_SUMMARY
            fi
          fi

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      checks: write  # Required for test reporter

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests with coverage
        run: ./mvnw test jacoco:report -B

      - name: Publish Test Report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: JUnit Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload test artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/site/jacoco/

      - name: Generate test summary
        if: always()
        run: |
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Parse JUnit XML for summary
          if [ -d target/surefire-reports ]; then
            TESTS=$(grep -h 'testsuite' target/surefire-reports/*.xml 2>/dev/null | head -1 | sed -n 's/.*tests="\([^"]*\)".*/\1/p' || echo "0")
            FAILURES=$(grep -h 'testsuite' target/surefire-reports/*.xml 2>/dev/null | head -1 | sed -n 's/.*failures="\([^"]*\)".*/\1/p' || echo "0")
            ERRORS=$(grep -h 'testsuite' target/surefire-reports/*.xml 2>/dev/null | head -1 | sed -n 's/.*errors="\([^"]*\)".*/\1/p' || echo "0")
            SKIPPED=$(grep -h 'testsuite' target/surefire-reports/*.xml 2>/dev/null | head -1 | sed -n 's/.*skipped="\([^"]*\)".*/\1/p' || echo "0")
            
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | $((TESTS - FAILURES - ERRORS - SKIPPED)) |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | $FAILURES |" >> $GITHUB_STEP_SUMMARY
            echo "| ⚠️ Errors | $ERRORS |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏭️ Skipped | $SKIPPED |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Extract coverage from JaCoCo
          if [ -f target/site/jacoco/jacoco.csv ]; then
            echo "## 📊 Code Coverage" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Calculate coverage percentage
            MISSED=$(awk -F',' 'NR>1 {sum+=$4} END {print sum}' target/site/jacoco/jacoco.csv)
            COVERED=$(awk -F',' 'NR>1 {sum+=$5} END {print sum}' target/site/jacoco/jacoco.csv)
            TOTAL=$((MISSED + COVERED))
            if [ $TOTAL -gt 0 ]; then
              COVERAGE=$((COVERED * 100 / TOTAL))
              echo "**Line Coverage: ${COVERAGE}%**" >> $GITHUB_STEP_SUMMARY
            fi
          fi


  # ============================================
  # Code Quality Job
  # ============================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Check code formatting
        run: ./mvnw validate -B

      - name: Compile and verify
        run: ./mvnw verify -DskipTests -B

  # ============================================
  # Security: SAST Scan (runs in parallel)
  # ============================================
  security-sast:
    name: SAST Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build for CodeQL
        run: ./mvnw compile -DskipTests -B

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"

  # ============================================
  # Security: Secret Scan (runs in parallel)
  # ============================================
  security-secrets:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

  # ============================================
  # Docker Build & Push Job
  # ============================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build, unit-test, code-quality, integration-test, security-sast, security-secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.build.outputs.version }}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Generate build summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags**: ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest**: ${{ steps.build-push.outputs.digest }}" >> $GITHUB_STEP_SUMMARY

      - name: Scan container for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # ============================================
  # Deploy to Development
  # ============================================
  deploy-dev:
    name: Deploy DEV
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: development
      url: https://dev.example.com

    steps:
      - name: Deploy to Development
        run: |
          echo "🚀 Deploying to Development..."
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.version }}"
          # Add your deployment commands here

      - name: Run smoke tests
        run: |
          echo "🧪 Running smoke tests..."
          echo "✅ Smoke tests passed"

  # ============================================
  # Deploy to SIT (parallel with DEV)
  # ============================================
  deploy-sit:
    name: Deploy SIT
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: sit
      url: https://sit.example.com

    steps:
      - name: Deploy to SIT
        run: |
          echo "🚀 Deploying to SIT..."
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.version }}"
          # Add your deployment commands here

      - name: Run smoke tests
        run: |
          echo "🧪 Running smoke tests..."
          echo "✅ SIT smoke tests passed"

  # ============================================
  # Deploy to UAT (waits for DEV + SIT)
  # ============================================
  deploy-uat:
    name: Deploy UAT
    runs-on: ubuntu-latest
    needs: [deploy-sit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: uat
      url: https://uat.example.com
    # NOTE: Configure "Required reviewers" in GitHub Settings > Environments > uat

    steps:
      - name: Deploy to UAT
        run: |
          echo "🚀 Deploying to UAT..."
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.version }}"
          # Add your deployment commands here

      - name: UAT smoke tests
        run: |
          echo "🧪 Running UAT smoke tests..."
          echo "✅ UAT smoke tests passed"

  # ============================================
  # Pipeline Summary
  # ============================================
  release-review:
    name: Release Review
    runs-on: ubuntu-latest
    needs: [deploy-uat]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      issues: write

    steps:
      - name: Generate Pipeline Summary
        run: |
          # Construct summary content to file
          {
            echo "## 🚀 CI/CD Pipeline Summary"
            echo ""
            echo "| Stage | Status |"
            echo "|-------|--------|"
            echo "| Build | ${{ needs.build.result == 'success' && '✅' || '❌' }} |"
            echo "| Tests | ${{ needs.unit-test.result == 'success' && '✅' || '❌' }} |"
            echo "| Quality | ${{ needs.code-quality.result == 'success' && '✅' || '❌' }} |"
            echo "| Docker | ${{ needs.docker.result == 'success' && '✅' || '❌' }} |"
            echo "| DEV | ${{ needs.deploy-dev.result == 'success' && '✅' || '❌' }} |"
            echo "| SIT | ${{ needs.deploy-sit.result == 'success' && '✅' || '❌' }} |"
            echo "| UAT | ${{ needs.deploy-uat.result == 'success' && '✅' || '❌' }} |"
          } > release_summary.md
          
          # Output to Step Summary
          cat release_summary.md >> $GITHUB_STEP_SUMMARY

      - name: Request Release Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: ${{ github.actor }}
          minimum-approvals: 1
          issue-title: "🚀 Approval Required: Release to Customer"
          issue-body-file-path: release_summary.md
          exclude-workflow-initiator-as-approver: false

  # ============================================
  # Release to Customer
  # ============================================
  release-customer:
    name: Release Customer
    runs-on: ubuntu-latest
    needs: release-review
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: customer
      url: https://customer.example.com
  
    steps:
      - name: Release to Customer
        run: |
          echo "🚀 Releasing to Customer..."
          # Note: Accessing version from build needs explicit dependency propagation or re-fetching if not available.
          # For now, we assume implicit context or just print static info as placeholder.
          echo "Releasing to customer environment..."