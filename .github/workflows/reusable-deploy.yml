# Reusable Deployment Workflow
# Called by deploy.yml for DRY deployment logic

name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: string
      image_tag:
        description: 'Docker image tag to deploy'
        required: true
        type: string
      version:
        description: 'Application version'
        required: true
        type: string
      run_tests:
        description: 'Whether to run post-deployment tests'
        required: false
        type: boolean
        default: true
    secrets:
      DEPLOY_TOKEN:
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure deployment
        id: config
        run: |
          case "${{ inputs.environment }}" in
            development)
              echo "url=https://dev.example.com" >> $GITHUB_OUTPUT
              echo "cluster=dev-cluster" >> $GITHUB_OUTPUT
              ;;
            sit)
              echo "url=https://sit.example.com" >> $GITHUB_OUTPUT
              echo "cluster=sit-cluster" >> $GITHUB_OUTPUT
              ;;
            uat)
              echo "url=https://uat.example.com" >> $GITHUB_OUTPUT
              echo "cluster=uat-cluster" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "Unknown environment: ${{ inputs.environment }}"
              exit 1
              ;;
          esac

      - name: Deploy application
        run: |
          echo "🚀 Deploying to ${{ inputs.environment }}..."
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ inputs.image_tag }}"
          echo "Version: ${{ inputs.version }}"
          echo "Cluster: ${{ steps.config.outputs.cluster }}"
          echo "URL: ${{ steps.config.outputs.url }}"
          
          # Add your deployment commands here
          # Example: kubectl, helm, aws, gcloud, etc.

      - name: Run post-deployment tests
        if: inputs.run_tests
        run: |
          echo "🧪 Running tests for ${{ inputs.environment }}..."
          # Add health check / smoke tests
          # curl -f ${{ steps.config.outputs.url }}/health || exit 1
          echo "✅ Tests passed"

      - name: Update deployment status
        run: |
          echo "## Deployment to ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ steps.config.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
