name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag/digest to deploy'
        required: true
        type: string
      version:
        description: 'Application version'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: false
        type: choice
        options:
          - all
          - development
          - sit
          - uat
        default: 'all'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================
  # Deploy to Development
  # ============================================
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    if: inputs.environment == 'all' || inputs.environment == 'development'
    environment:
      name: development
      url: https://dev.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Development
        run: |
          echo "🚀 Deploying to Development environment..."
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ inputs.image_tag }}"
          echo "Version: ${{ inputs.version }}"
          # Add your actual deployment commands here
          # Examples:
          # - kubectl set image deployment/app app=$IMAGE
          # - aws ecs update-service --cluster dev --service app --force-new-deployment
          # - helm upgrade app ./chart --set image.tag=$VERSION

      - name: Run smoke tests
        run: |
          echo "🧪 Running smoke tests on Development..."
          # Add actual smoke test commands
          # curl -f https://dev.example.com/health || exit 1
          echo "✅ Smoke tests passed"

      - name: Deployment summary
        run: |
          echo "## Development Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Deploy to SIT
  # ============================================
  deploy-sit:
    name: Deploy to SIT
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: inputs.environment == 'all' || inputs.environment == 'sit'
    environment:
      name: sit
      url: https://sit.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to SIT
        run: |
          echo "🚀 Deploying to SIT environment..."
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ inputs.image_tag }}"
          echo "Version: ${{ inputs.version }}"
          # Add your actual deployment commands here

      - name: Run integration tests
        run: |
          echo "🧪 Running integration tests on SIT..."
          # Add actual integration test commands
          # ./mvnw verify -Pintegration-tests
          echo "✅ Integration tests passed"

      - name: Deployment summary
        run: |
          echo "## SIT Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Deploy to UAT (Requires Approval)
  # ============================================
  deploy-uat:
    name: Deploy to UAT
    runs-on: ubuntu-latest
    needs: deploy-sit
    if: inputs.environment == 'all' || inputs.environment == 'uat'
    environment:
      name: uat
      url: https://uat.example.com
    # NOTE: This environment should have "Required reviewers" configured
    # in GitHub repository settings > Environments > uat > Protection rules

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to UAT
        run: |
          echo "🚀 Deploying to UAT environment..."
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ inputs.image_tag }}"
          echo "Version: ${{ inputs.version }}"
          # Add your actual deployment commands here

      - name: Run UAT validation
        run: |
          echo "🧪 Running UAT validation tests..."
          # Add actual UAT validation commands
          echo "✅ UAT validation passed"

      - name: Deployment summary
        run: |
          echo "## UAT Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Note**: This deployment was approved by designated reviewers." >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Deployment Complete Notification
  # ============================================
  notify:
    name: Notify Deployment Complete
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-sit, deploy-uat]
    if: always()

    steps:
      - name: Check deployment status
        run: |
          echo "## Deployment Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Development | ${{ needs.deploy-dev.result == 'success' && '✅' || '❌' }} ${{ needs.deploy-dev.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SIT | ${{ needs.deploy-sit.result == 'success' && '✅' || '❌' }} ${{ needs.deploy-sit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| UAT | ${{ needs.deploy-uat.result == 'success' && '✅' || '❌' }} ${{ needs.deploy-uat.result }} |" >> $GITHUB_STEP_SUMMARY
