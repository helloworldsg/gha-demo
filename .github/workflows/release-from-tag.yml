name: Release from Tag

# Triggered when a tag is pushed manually
# Skips build/test (already done) and deploys directly

on:
  push:
    tags:
      - 'v*.*.*'  # Matches v1.0.0, v2.1.3, etc.

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================
  # Validate Tag
  # ============================================
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image_exists: ${{ steps.check.outputs.exists }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

      - name: Check if Docker image exists
        id: check
        run: |
          # Check if image for this commit SHA exists
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA::7}"
          
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Found existing image: $IMAGE"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ No existing image found for this commit"
          fi

      - name: Validate release
        run: |
          echo "## Release Validation" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${GITHUB_SHA::7}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Exists**: ${{ steps.check.outputs.exists }}" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Quick Build (only if no existing image)
  # ============================================
  build-if-needed:
    name: Build (if needed)
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.image_exists == 'false'
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw verify -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.validate.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Tag Existing Image (if image already exists)
  # ============================================
  tag-existing:
    name: Tag Existing Image
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.image_exists == 'true'
    
    permissions:
      packages: write

    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Add version tag to existing image
        run: |
          SOURCE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA::7}"
          TARGET="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.validate.outputs.version }}"
          
          echo "Tagging $SOURCE as $TARGET"
          
          # Use crane or skopeo to copy/tag without pulling
          docker pull "$SOURCE"
          docker tag "$SOURCE" "$TARGET"
          docker push "$TARGET"
          
          echo "✅ Tagged existing image with version ${{ needs.validate.outputs.version }}"

  # ============================================
  # Create GitHub Release
  # ============================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, build-if-needed, tag-existing]
    if: always() && needs.validate.result == 'success' && (needs.build-if-needed.result == 'success' || needs.build-if-needed.result == 'skipped') && (needs.tag-existing.result == 'success' || needs.tag-existing.result == 'skipped')
    
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          echo "## What's Changed" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          
          if [ -n "$PREV_TAG" ]; then
            git log ${PREV_TAG}..HEAD --oneline --pretty=format:"- %s (%h)" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ needs.validate.outputs.version }}" >> CHANGELOG.md
          else
            git log --oneline --pretty=format:"- %s (%h)" -20 >> CHANGELOG.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          name: Release ${{ needs.validate.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false

  # ============================================
  # Deploy to Environments
  # ============================================
  deploy:
    name: Deploy from Tag
    runs-on: ubuntu-latest
    needs: [validate, create-release]
    
    strategy:
      matrix:
        environment: [development, sit]
      max-parallel: 1  # Deploy sequentially

    environment:
      name: ${{ matrix.environment }}

    steps:
      - name: Deploy to ${{ matrix.environment }}
        run: |
          echo "🚀 Deploying ${{ needs.validate.outputs.version }} to ${{ matrix.environment }}"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.validate.outputs.version }}"
          # Add your deployment commands here

      - name: Deployment summary
        run: |
          echo "## Deployed to ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Deploy to UAT (Requires Approval)
  # ============================================
  deploy-uat:
    name: Deploy to UAT
    runs-on: ubuntu-latest
    needs: [validate, deploy]
    environment:
      name: uat
      url: https://uat.example.com

    steps:
      - name: Deploy to UAT
        run: |
          echo "🚀 Deploying ${{ needs.validate.outputs.version }} to UAT"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.validate.outputs.version }}"
          # Add your deployment commands here

      - name: Deployment summary
        run: |
          echo "## Deployed to UAT" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Approved by designated reviewers" >> $GITHUB_STEP_SUMMARY
